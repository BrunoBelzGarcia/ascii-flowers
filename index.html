<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#000000">
<meta name="description" content="Flowers for you">

<title>ascii flowers</title>
<style>

  #download { background:#e8d39b; color:#181406; font-weight:600; }
  #download:hover { background:#f6e4b2; }
  #download span { margin-inline-end:6px; }

  #replay:hover { color:#f1e4c9; text-decoration:underline; }

  #copyFallback:focus { outline:2px solid #eed681; }
  @media(max-height:500px) { .greeting { padding-top:max(14px,env(safe-area-inset-top)); font-size:32px; } }
</style>
</head>
<body>
<main>
  <h1 class="greeting">Flowers for you</h1>
  <div class="art"><canvas id="bouquet" role="img" aria-label="ASCII flowers">ASCII flowers.</canvas></div>
  <footer aria-label="Save flowers">
    <div class="actions">
      <button id="download" type="button"><span aria-hidden="true">↓</span>Download image</button>
      <button id="copy" type="button">Copy ASCII text</button>
    </div>
    <button id="replay" type="button">Replay bloom</button>
    <textarea id="copyFallback" readonly aria-label="Flower text. Select all and copy."></textarea>
    <p id="status" role="status" aria-live="polite"></p>
  </footer>
</main>
<noscript><style>main{display:none}</style><p class="fallback">This bouquet needs JavaScript to draw its ASCII characters. Enable JavaScript and reload.</p></noscript>
<script>
'use strict';
// Reference: https://github.com/Isaac-opz/asciiFlowers
const canvas=document.getElementById('bouquet');

const copyButton = document.getElementById('copy');

const BLOOM_DURATION = 6200;

function drawScene(ctx, time) {

  const curve=(tip,t)=> { const u=1-t;return [u*u*u*500+3*u*u*t*500+3*u*t*t*(500+(tip[0]-500)*.7)+t*t*t*tip[0],u*u*u*1050+3*u*u*t*830+3*u*t*t*(tip[1]+200)+t*t*t*tip[1]]; };

      ctx.strokeStyle=ring?'#ffe49c':'#f6c34a';ctx.lineWidth=r*.022;ctx.beginPath();ctx.moveTo(0,-r*.48);ctx.quadraticCurveTo(w*.28,-tip*.73,0,-tip*.91);ctx.stroke();ctx.restore();

    center.addColorStop(.86, '#865a31');

    const seedCount = 144;

  function aster(x,y,r,rotation,white=false) {

    ['purple', 735, 235, 73, .3, 4550],
    ['lily', 180, 460, 90, -.3, 3430],
    ['lily', 825, 465, 86, .3, 3690],
    ['sun', 500, 220, 132, -.1, 2350],
    ['sun', 340, 415, 107, -.2, 2810],
    ['sun', 665, 420, 108, .2, 3090],
    ['purple', 230, 605, 68, -.3, 4780],
    ['purple', 470, 530, 73, .15, 4060],

    image.width = 1280;
    image.height = 1500;
    const ctx = image.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, image.width, image.height);
    ctx.fillStyle = '#f1e4c9';
